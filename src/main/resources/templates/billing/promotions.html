<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>The Blind Pig — Акції</title>
</head>
<body>
<h1>💳 Акції та промокоди</h1>

<h2>Автоматичні знижки</h2>
<ul>
    <li th:each="d : ${discounts}" th:text="${d.name} + ' — ' + ${d.value} + ' (' + ${d.type} + ')'">Знижка</li>
</ul>
<p th:if="${#lists.isEmpty(discounts)}">Знижок поки немає.</p>

<h2>Промокоди</h2>
<ul>
    <li th:each="p : ${promoCodes}" th:text="${p.code} + ' — ' + ${p.value} + ' (' + ${p.type} + ')'">Код</li>
</ul>
<p th:if="${#lists.isEmpty(promoCodes)}">Промокодів поки немає.</p>
</body>
</html>
